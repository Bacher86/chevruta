name: Deploy a GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Compilar (npm run build)
        run: npm run build

      - name: Preparar artefacto para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Backend: Cloud Functions (notificaciones push) + reglas de Firestore.
  # Esto NO se sube como archivos estáticos — hay que desplegarlo activamente
  # contra el proyecto de Firebase cada vez que cambia functions/index.js
  # o firestore.rules.
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias del backend
        run: npm install
        working-directory: functions

      - name: Desplegar Cloud Functions y reglas de Firestore
        uses: w9jds/firebase-action@v13.13.1
        with:
          args: deploy --only functions,firestore:rules --project app-encuentro-596c8
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
